apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: default
  labels:
    app: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: devops-todo-capstone
          image: 782208973324.dkr.ecr.ap-south-1.amazonaws.com/devops-todo-capstone:v2
          imagePullPolicy: IfNotPresent
